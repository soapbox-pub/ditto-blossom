[package]
name = "ditto-blossom"
version = "0.1.0"
edition = "2024"
description = "High-performance Blossom server on LMDB, built for ext4 and sendfile"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
brotli = "9.0.0"
bytes = "1.12.1"
hex = "0.4.3"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
infer = "0.22.0"
libc = "0.2.190"
libdeflater = "1.26.1"
lmdb-master-sys = "0.2.6"
lru = "0.18.5"
memmap2 = "0.9.11"
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
ring = "0.17"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secp256k1 = { version = "0.33", features = ["global-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "fat"
