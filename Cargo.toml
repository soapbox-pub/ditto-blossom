[package]
name = "ditto-blossom"
version = "0.1.0"
edition = "2024"
description = "High-performance Blossom server on LMDB, built for ext4 and sendfile"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
brotli = "9.0.0"
bytes = "1.12.1"
fast_image_resize = "6.1.0"
hex = "0.4.3"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
infer = "0.22.0"
jpeg-decoder = { version = "0.3.2", default-features = false }
libc = "0.2.190"
libdeflater = "1.26.1"
lmdb-master-sys = "0.2.6"
lopdf = { version = "0.47.0", default-features = false }
lru = "0.18.5"
memchr = "2.8.3"
memmap2 = "0.9.11"
# Exact: ort-sys checks the ONNX Runtime it downloads against hashes of its
# own, so this version pins the binary. ORT_LIB_LOCATION links one instead.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
ring = "0.17"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secp256k1 = { version = "0.33", features = ["global-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
url = "2.5.8"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "fat"
