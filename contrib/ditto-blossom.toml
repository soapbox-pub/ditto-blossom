# ditto-blossom's config. Only `data` and `public_url` are required; the
# rest are the defaults.

# Plain HTTP; TLS belongs to whatever is in front (a proxy, or a tunnel).
listen = "127.0.0.1:3000"

# Blobs and the database. Meant for ext4 or xfs: large blobs are sent with
# sendfile(2), which those make nearly free.
data = "/var/lib/ditto-blossom"

# Where clients reach the server. Blob URLs begin with it, and auth tokens'
# `server` tags must name its hostname.
public_url = "https://blossom.example.com"

# Peers whose X-Forwarded-For is believed (rate limits and logs use the
# client's address): the last address in it that isn't one of these.
trusted_proxies = ["127.0.0.1", "::1"]

# Blob files kept mapped and open.
open_files = 4096

# Threads making brotli copies of compressible blobs, at low priority.
# Unset: half the CPUs. 0: none.
# compress_threads = 4

# Hex pubkeys no ban may name (ban --pubkey, the dashboard, a scan match):
# keys that upload for many people, like another server's. upload.exempt
# keys are protected too.
protected = []

[upload]
require_auth = true
max_size = 2147483648   # bytes
per_minute = 60         # uploads and mirrors a client may start
bytes_per_hour = 1073741824   # and how much they may bring in
# Hex pubkeys whose uploads and mirrors skip max_size, per_minute and
# bytes_per_hour.
exempt = []

[list]
enabled = false
require_auth = false

[mirror]
enabled = true
# Let mirrors fetch from private and local addresses (only where clients may
# reach everything the server can).
allow_private = false

[report]
enabled = true

# Scanning new uploads and mirrors (see the README), on when enabled, by
# whichever of these is set up.
[scan]
enabled = false

# Matching images against known CSAM with Arachnid Shield
# (https://projectarachnid.ca/en/#shield, free for service providers). Only
# PDQ hashes, computed here, are sent to it. See the README's "Scanning".
shield_url = "https://shield.projectarachnid.com"
# username:password from the Shield account page; readable by the server
# alone. Unset: no Shield.
# credentials_file = "/etc/ditto-blossom/shield"
# A directory per match: its blobs and record.json, for the NCMEC report.
# evidence = "/var/lib/ditto-blossom/scan-matches"
# Run on each match with its record (JSON) on stdin, to tell someone.
# alert_command = ["/usr/local/bin/alert-csam"]
# Seconds between tries at blobs kept while Shield couldn't be asked.
retry_every = 300

# Refusing explicit images and video (see the README's "Refusing explicit
# media"): an encoder made by contrib/clip-model.py and a head made by
# `ditto-blossom train`. Unset model and head: no refusing.
# model = "/var/lib/ditto-blossom/clip-b32.onnx"
# head = "/var/lib/ditto-blossom/head.json"
# threshold = 0.16       # unset: the one training chose
# workers = 2            # each ~8 images/s on a core; ~380 MB for them all
ffmpeg = "ffmpeg"        # video, AVIF, HEIC, JPEG XL; "" passes them unscanned
refuse_undecodable = true
require_sandbox = true   # don't start unless ffmpeg's files and network are shut off
background = false       # store at once and scan after; refused blobs are taken out
hold = true              # with background: don't serve a blob until it's scanned

# The admin dashboard (see the README), on a listener of its own. Unset
# `listen`: there's none. Reach it by SSH tunnel, or proxy a host name of its
# own to it over https; the README says what that's safe against.
[admin]
# listen = "127.0.0.1:3001"
# url = "https://admin.example.com"   # where admins open it; http:// and listen if unset
# pubkeys = []           # hex pubkeys that may sign in
# preserve = "/var/lib/ditto-blossom/evidence"   # where Ban as CSAM keeps evidence (this, by default)
# cdn = "Cloudflare"     # the cache in front of public_url, if any: what to purge from it
# labels = "/var/lib/ditto-blossom/labels.json"     # train --labels, added to
# embeddings = "/var/lib/ditto-blossom/embeddings.jsonl"  # train --cache, added to

# Bans and unbans shared with other servers (see the README). Unset: none.
[moderation]
# tokens_file = "/etc/ditto-blossom-moderation-tokens"   # a line each, for peers to read with
pull_every = 60
# [[moderation.peers]]
# url = "https://blossom.example.org"
# token_file = "/etc/ditto-blossom-peer-example"   # the token it gave this server
# skip = ["scan:"]   # don't follow bans whose reasons start with these
